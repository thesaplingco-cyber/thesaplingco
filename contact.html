<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us — The Sapling Co. | Uttarpara, West Bengal</title>
  <meta name="description" content="Get in touch with The Sapling Co. — WhatsApp, email thesaplingco@gmail.com, Instagram @thesaplingco, or visit our nursery in Uttarpara, Hooghly, West Bengal. We reply within 24 hours.">
  <link rel="icon" type="image/png" href="assets/images/logo/favicon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Contact The Sapling Co.">
  <meta property="og:description" content="Questions about a plant or your order? We're here to help.">
  <meta property="og:image" content="assets/images/logo/logo-square.png">
  <meta name="theme-color" content="#0B1E12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&display=swap"></noscript>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>
    (function () { var d = document.documentElement; d.classList.add("js");
      try { var t = localStorage.getItem("sapling-theme"); if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; d.setAttribute("data-theme", t); } catch (e) { d.setAttribute("data-theme", "light"); }
      try { var l = localStorage.getItem("sapling-lang"); d.classList.add(l === "bn" ? "lang-bn" : "lang-en"); if (l === "bn") d.setAttribute("lang", "bn"); } catch (e) {} })();
  </script>
</head>
<body data-page="contact">
  <div id="preloader" aria-hidden="true">
    <div class="preloader__mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V10"/><path d="M12 12C8 12 5 9 5 5c4 0 7 3 7 7z"/><path d="M12 10c0-3 2.5-5.5 7-5.5 0 4-3 5.5-7 5.5z"/></svg></div>
    <span class="preloader__name">The Sapling Co.</span>
  </div>
  <header id="site-header"></header>

  <main id="main">
    <section class="page-head page-head--photo">
      <div class="band-photo" style="background-image:url('assets/images/contact-hero.jpg')"></div>
      <div class="container page-head__inner">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html" data-i18n="nav_home"></a><span data-icon="chevronRight"></span><span aria-current="page" data-i18n="nav_contact"></span>
        </nav>
        <h1 data-i18n="contact_h1"></h1>
        <p data-i18n="contact_sub"></p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="split" style="align-items:start">
          <div class="form-card reveal">
            <h2 class="section-title" style="font-size:1.4rem" data-i18n="contact_form_title"></h2>
            <p style="color:var(--text-muted);margin:.4rem 0 1.4rem" data-i18n="contact_form_sub"></p>
            <form id="contact-form" novalidate>
              <div class="form-grid">
                <div class="field"><label for="c-name"><span data-i18n="f_name"></span> <span class="req">*</span></label><input id="c-name" name="name" data-label="Name" type="text" autocomplete="name" required></div>
                <div class="field"><label for="c-email"><span data-i18n="f_email"></span> <span class="req">*</span></label><input id="c-email" name="email" data-label="Email" type="email" autocomplete="email" required></div>
                <div class="field full"><label for="c-order"><span data-i18n="f_order"></span> <span class="hint" data-i18n="f_opt"></span></label><input id="c-order" name="order" data-label="Order / reference" type="text"></div>
                <div class="field full"><label for="c-message"><span data-i18n="f_message"></span> <span class="req">*</span></label><textarea id="c-message" name="message" data-label="Message" data-i18n-ph="ph_message" required></textarea></div>
              </div>
              <button class="btn btn--primary btn--block btn--lg mt-3" type="submit" data-i18n="btn_send_message"></button>
              <div class="form-status" role="status" aria-live="polite"></div>
              <p class="form-note" data-i18n="req_note"></p>
            </form>
          </div>

          <div class="stack-lg reveal">
            <div class="card method-card">
              <div class="method-card__icon" data-icon="whatsapp"></div>
              <div><h3 data-i18n="cm_wa_t">WhatsApp us</h3><p data-i18n="cm_wa_p">Fastest reply · 10 am – 7 pm</p><a class="method-link" href="https://wa.me/918902262452" target="_blank" rel="noopener">+91 89022 62452 →</a></div>
            </div>
            <div class="card method-card">
              <div class="method-card__icon" data-icon="mail"></div>
              <div><h3 data-i18n="cm_em_t">Email</h3><p data-i18n="cm_em_p">We reply within 24 hours</p><a class="method-link" href="mailto:thesaplingco@gmail.com">thesaplingco@gmail.com →</a></div>
            </div>
            <div class="card method-card">
              <div class="method-card__icon" data-icon="instagram"></div>
              <div><h3 data-i18n="cm_ig_t">Instagram</h3><p data-i18n="cm_ig_p">Follow for plant care &amp; new arrivals</p><a class="method-link" href="https://instagram.com/thesaplingco" target="_blank" rel="noopener">@thesaplingco →</a></div>
            </div>
            <div class="card method-card">
              <div class="method-card__icon" data-icon="mapPin"></div>
              <div><h3 data-i18n="cm_ns_t">Our nursery</h3><p>Raghunathpur Naskarpara, Serampore–Uttarpara, Hooghly, West Bengal — 712247</p><a class="method-link" href="https://maps.app.goo.gl/BWgZULFZqcSqRs946" target="_blank" rel="noopener" data-i18n="btn_get_directions"></a></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="section--tight">
      <div class="container">
        <div class="map-wrap reveal" style="height:380px">
          <button class="map-facade" data-map="https://www.google.com/maps?q=Raghunathpur+Naskarpara+Serampore+Uttarpara+Hooghly+West+Bengal+712247&output=embed" aria-label="Load interactive map of the nursery">
            <span class="map-facade__inner">
              <span class="map-facade__pin" data-icon="mapPin"></span>
              <b data-i18n="map_b"></b>
              <span data-i18n="map_s"></span>
            </span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="assets/js/i18n.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
