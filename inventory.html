<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Inventory — Browse 70+ Plant Varieties | The Sapling Co.</title>
  <meta name="description" content="Browse The Sapling Co.'s full plant inventory — fruit trees, palms, flowering shrubs, ornamental foliage, indoor plants, succulents & cactus, and landscape plants. 180–220 plants across 7 categories.">
  <link rel="icon" type="image/png" href="assets/images/logo/favicon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Our Inventory — The Sapling Co.">
  <meta property="og:description" content="Fruit trees, flowering shrubs, indoor foliage, succulents and more — grown in Bengal.">
  <meta property="og:image" content="assets/images/logo/logo-square.png">
  <meta name="theme-color" content="#0B1E12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&display=swap"></noscript>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>
    (function () { var d = document.documentElement; d.classList.add("js");
      try { var t = localStorage.getItem("sapling-theme"); if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; d.setAttribute("data-theme", t); } catch (e) { d.setAttribute("data-theme", "light"); }
      try { var l = localStorage.getItem("sapling-lang"); d.classList.add(l === "bn" ? "lang-bn" : "lang-en"); if (l === "bn") d.setAttribute("lang", "bn"); } catch (e) {} })();
  </script>
</head>
<body data-page="inventory">
  <div id="preloader" aria-hidden="true">
    <div class="preloader__mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V10"/><path d="M12 12C8 12 5 9 5 5c4 0 7 3 7 7z"/><path d="M12 10c0-3 2.5-5.5 7-5.5 0 4-3 5.5-7 5.5z"/></svg></div>
    <span class="preloader__name">The Sapling Co.</span>
  </div>
  <header id="site-header"></header>

  <main id="main">
    <section class="page-head page-head--photo page-head--collage">
      <div class="band-photo" style="background-image:url('assets/images/inventory-collage.jpg')"></div>
      <div class="container page-head__inner">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html" data-i18n="nav_home"></a><span data-icon="chevronRight"></span><span aria-current="page" data-i18n="nav_inventory"></span>
        </nav>
        <h1 data-i18n="inv_h1"></h1>
        <p data-i18n="inv_p"></p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="grid grid-3" id="category-grid">
          <a class="card cat-card reveal" href="inventory-indoor-plants.html">
            <div class="cat-card__media"><img src="assets/images/cat-indoor.jpg" alt="Leafy indoor plants in pots" loading="lazy"><span class="cat-card__count">45–60</span></div>
            <div class="cat-card__body"><span class="badge badge--gold" style="align-self:flex-start;margin-bottom:.2rem" data-i18n="badge_specialty"></span><h3 data-i18n="cat_indoor_name"></h3><p data-i18n="cat_indoor_desc"></p><span class="cat-card__cta" data-i18n="btn_view_collection"></span></div>
          </a>
          <a class="card cat-card reveal" href="inventory-fruit-trees.html">
            <div class="cat-card__media"><img src="assets/images/cat-fruit.jpg" alt="Mangoes on a grafted fruit tree" loading="lazy"><span class="cat-card__count">35–45</span></div>
            <div class="cat-card__body"><h3 data-i18n="cat_fruit_name"></h3><p data-i18n="cat_fruit_desc"></p><span class="cat-card__cta" data-i18n="btn_view_collection"></span></div>
          </a>
          <a class="card cat-card reveal" href="inventory-flowering-shrubs.html">
            <div class="cat-card__media"><img src="assets/images/cat-flowering.jpg" alt="A red hibiscus in bloom" loading="lazy"><span class="cat-card__count">40–50</span></div>
            <div class="cat-card__body"><h3 data-i18n="cat_flower_name"></h3><p data-i18n="cat_flower_desc"></p><span class="cat-card__cta" data-i18n="btn_view_collection"></span></div>
          </a>
          <a class="card cat-card reveal" href="inventory-succulents-cactus.html">
            <div class="cat-card__media"><img src="assets/images/cat-succulents.jpg" alt="Rosette succulents" loading="lazy"><span class="cat-card__count">35–45</span></div>
            <div class="cat-card__body"><h3 data-i18n="cat_succ_name"></h3><p data-i18n="cat_succ_desc"></p><span class="cat-card__cta" data-i18n="btn_view_collection"></span></div>
          </a>
          <a class="card cat-card reveal" href="inventory-palms-coconut.html">
            <div class="cat-card__media"><img src="assets/images/cat-palms.jpg" alt="An areca palm in a basket" loading="lazy"><span class="cat-card__count">20–25</span></div>
            <div class="cat-card__body"><h3 data-i18n="cat_palm_name"></h3><p data-i18n="cat_palm_desc"></p><span class="cat-card__cta" data-i18n="btn_view_collection"></span></div>
          </a>
          <a class="card cat-card reveal" href="inventory-ornamental-foliage.html">
            <div class="cat-card__media"><img src="assets/images/cat-ornamental.jpg" alt="A croton with variegated leaves" loading="lazy"><span class="cat-card__count">25+</span></div>
            <div class="cat-card__body"><h3 data-i18n="cat_orn_name"></h3><p data-i18n="cat_orn_desc"></p><span class="cat-card__cta" data-i18n="btn_view_collection"></span></div>
          </a>
          <a class="card cat-card reveal" href="inventory-landscape-plants.html">
            <div class="cat-card__media"><img src="assets/images/cat-landscape.jpg" alt="Lush tropical foliage" loading="lazy"><span class="cat-card__count">20+</span></div>
            <div class="cat-card__body"><h3 data-i18n="cat_land_name"></h3><p data-i18n="cat_land_desc"></p><span class="cat-card__cta" data-i18n="btn_view_collection"></span></div>
          </a>
          <div class="card feature reveal" style="display:flex;flex-direction:column;justify-content:center;background:var(--forest);text-align:center;align-items:center">
            <div class="feature__icon" data-icon="sprout" style="background:rgba(255,255,255,.12);color:var(--lime)"></div>
            <h3 style="color:var(--cream)" data-i18n="inv_cant_h"></h3>
            <p style="color:var(--on-dark-muted)" data-i18n="inv_cant_p"></p>
            <a class="btn btn--primary mt-2" href="index.html#request" data-i18n="btn_request_plant"></a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="assets/js/i18n.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
